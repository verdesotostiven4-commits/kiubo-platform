name: KIUBO Supabase Verify

on:
  push:
    branches:
      - supabase-migrate-once
    paths:
      - docs/SUPABASE_VERIFY_TRIGGER.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database state
        id: verify
        shell: bash
        run: |
          set +e
          RESULT_FILE="docs/SUPABASE_VERIFY_RESULT.txt"
          : > "$RESULT_FILE"

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "status=secret_missing" >> "$RESULT_FILE"
            echo "expected_tables=13" >> "$RESULT_FILE"
            echo "found_tables=0" >> "$RESULT_FILE"
            exit 0
          fi

          CONNECT_OK=false
          COUNT=0
          TABLES=""
          for attempt in $(seq 1 45); do
            TABLES=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
              select table_name
              from information_schema.tables
              where table_schema='public'
                and table_name in (
                  'platform_admins','tenants','tenant_members','branches','tenant_member_branches',
                  'plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings',
                  'tenant_branding','sync_entities','sync_receipts'
                )
              order by table_name;
            " 2> /tmp/kiubo_psql_error.txt)
            RC=$?
            if [ $RC -eq 0 ]; then
              CONNECT_OK=true
              COUNT=$(printf "%s\n" "$TABLES" | sed '/^$/d' | wc -l | tr -d ' ')
              if [ "$COUNT" = "13" ]; then
                break
              fi
            fi
            sleep 2
          done

          if [ "$CONNECT_OK" != "true" ]; then
            echo "status=connection_failed" >> "$RESULT_FILE"
            echo "expected_tables=13" >> "$RESULT_FILE"
            echo "found_tables=0" >> "$RESULT_FILE"
            echo "error:" >> "$RESULT_FILE"
            sed -E 's#postgres(ql)?://[^ ]+#<redacted-db-url>#g' /tmp/kiubo_psql_error.txt | head -n 12 >> "$RESULT_FILE"
            exit 0
          fi

          echo "expected_tables=13" >> "$RESULT_FILE"
          echo "found_tables=$COUNT" >> "$RESULT_FILE"
          if [ "$COUNT" = "13" ]; then
            echo "status=success" >> "$RESULT_FILE"
          else
            echo "status=partial" >> "$RESULT_FILE"
          fi
          echo "tables:" >> "$RESULT_FILE"
          printf "%s\n" "$TABLES" >> "$RESULT_FILE"

          FUNCTIONS=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select proname
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and proname in (
                'is_platform_admin','has_tenant_access','has_tenant_role','has_branch_access',
                'tenant_can_operate','tenant_feature_enabled','can_sync_entity',
                'apply_sync_operations','pull_sync_changes','platform_provision_tenant',
                'can_manage_tenant_users','platform_set_tenant_plan','platform_set_tenant_status',
                'can_assign_tenant_role','branch_belongs_to_tenant','normalize_sync_payload'
              )
            order by proname;
          " 2>/dev/null)
          echo "functions:" >> "$RESULT_FILE"
          printf "%s\n" "$FUNCTIONS" >> "$RESULT_FILE"

      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SUPABASE_VERIFY_RESULT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Supabase verification result [skip ci]"
          git push
