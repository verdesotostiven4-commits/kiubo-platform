name: KIUBO Panadería demo
on:
  pull_request:
    paths:
      - 'products/panaderia/**'
      - '.github/workflows/panaderia-demo.yml'
  push:
    branches:
      - main
    paths:
      - 'products/panaderia/**'
jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check products/panaderia/demo/app.js
      - name: Simulate sales, cash, security and stock
        run: node products/panaderia/tests/smoke.mjs
      - name: Verify installable DeliScias app syntax
        run: node --check products/panaderia/app/app.js
      - name: Validate DeliScias money math and PWA release safety
        run: node products/panaderia/app/test-static.mjs
