name: KIUBO Supabase Migrate Once

on:
  push:
    branches:
      - supabase-migrate-once
    paths:
      - docs/SUPABASE_MIGRATE_TRIGGER.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: supabase-migrate-once

      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Diagnose, migrate and verify safely
        shell: bash
        run: |
          set +e
          RESULT=docs/SUPABASE_RUN_RESULT.txt
          : > "$RESULT"
          echo "KIUBO Supabase bootstrap result" >> "$RESULT"
          echo "run_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RESULT"

          python3 - <<'PY' >> "$RESULT"
          import os
          from urllib.parse import urlparse
          u=os.environ.get('SUPABASE_DB_URL','')
          if not u:
              print('secret=missing')
              raise SystemExit(0)
          print('secret=present')
          print('placeholder=' + ('yes' if '[YOUR-PASSWORD]' in u else 'no'))
          try:
              p=urlparse(u)
              print('scheme=' + str(p.scheme))
              print('host=' + str(p.hostname))
              print('port=' + str(p.port))
              print('user=' + str(p.username))
              print('database=' + str((p.path or '').lstrip('/')))
              print('password_present=' + ('yes' if p.password else 'no'))
          except Exception as e:
              print('parse_error=' + type(e).__name__ + ':' + str(e))
          PY

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "status=FAILED_SECRET_MISSING" >> "$RESULT"
          else
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select 1;" > /tmp/kiubo_psql_out 2> /tmp/kiubo_psql_err
            CONNECT_CODE=$?
            if [ $CONNECT_CODE -ne 0 ]; then
              echo "status=FAILED_CONNECTION" >> "$RESULT"
              python3 - <<'PY' >> "$RESULT"
          import os
          from urllib.parse import urlparse
          err=open('/tmp/kiubo_psql_err','r',encoding='utf-8',errors='replace').read()
          try:
              pw=urlparse(os.environ.get('SUPABASE_DB_URL','')).password
              if pw:
                  err=err.replace(pw,'<redacted>')
          except Exception:
              pass
          print('error=' + err.replace('\n',' | ')[:3000])
          PY
            else
              echo "connection=ok" >> "$RESULT"
              COUNT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts');")
              COUNT_CODE=$?
              echo "tables_before=${COUNT:-unknown}/13" >> "$RESULT"

              if [ $COUNT_CODE -ne 0 ]; then
                echo "status=FAILED_SCHEMA_CHECK" >> "$RESULT"
              elif [ "$COUNT" = "0" ]; then
                cat \
                  supabase/migrations/0001_core_multitenant.sql \
                  supabase/migrations/0002_sync_substrate.sql \
                  supabase/migrations/0003_platform_provisioning.sql \
                  supabase/migrations/0004_security_guardrails.sql \
                  supabase/migrations/0005_sync_payload_guardrails.sql \
                  > /tmp/kiubo_all_migrations.sql

                psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1 -f /tmp/kiubo_all_migrations.sql > /tmp/kiubo_migrate_out 2> /tmp/kiubo_migrate_err
                MIGRATE_CODE=$?
                if [ $MIGRATE_CODE -ne 0 ]; then
                  echo "status=FAILED_MIGRATION" >> "$RESULT"
                  python3 - <<'PY' >> "$RESULT"
          import os
          from urllib.parse import urlparse
          err=open('/tmp/kiubo_migrate_err','r',encoding='utf-8',errors='replace').read()
          try:
              pw=urlparse(os.environ.get('SUPABASE_DB_URL','')).password
              if pw:
                  err=err.replace(pw,'<redacted>')
          except Exception:
              pass
          print('error=' + err.replace('\n',' | ')[:5000])
          PY
                else
                  echo "migration=applied_0001_0005" >> "$RESULT"
                fi
              elif [ "$COUNT" = "13" ]; then
                echo "migration=skipped_schema_already_present" >> "$RESULT"
              else
                echo "status=FAILED_PARTIAL_SCHEMA" >> "$RESULT"
              fi

              if ! grep -q '^status=FAILED_' "$RESULT"; then
                TABLES=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts');")
                FUNCTIONS=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(distinct proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and proname in ('is_platform_admin','has_tenant_access','has_tenant_role','has_branch_access','tenant_can_operate','tenant_feature_enabled','can_sync_entity','apply_sync_operations','pull_sync_changes','platform_provision_tenant','can_manage_tenant_users','platform_set_tenant_plan','platform_set_tenant_status','can_assign_tenant_role','branch_belongs_to_tenant','normalize_sync_payload');")
                RLS=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts') and c.relrowsecurity;")
                echo "tables_after=$TABLES/13" >> "$RESULT"
                echo "functions=$FUNCTIONS/16" >> "$RESULT"
                echo "rls=$RLS/13" >> "$RESULT"
                if [ "$TABLES" = "13" ] && [ "$FUNCTIONS" = "16" ] && [ "$RLS" = "13" ]; then
                  echo "status=SUCCESS" >> "$RESULT"
                else
                  echo "status=FAILED_VERIFY" >> "$RESULT"
                fi
              fi
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "chore: record Supabase bootstrap result" || true
          git push origin HEAD:supabase-migrate-once
