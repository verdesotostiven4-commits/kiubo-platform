name: Apply YUKI workflow UX v15
on:
  push:
    branches: [fix/yuki-workflow-ux-v15]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yuki-workflow-ux-v15
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply workflow fixes
        run: python3 .github/scripts/apply-yuki-v15.py
      - run: npm install --ignore-scripts
      - run: npm run verify
      - run: npm run build
      - name: Commit verified fixes
        run: |
          git config user.name "kiubo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/DashboardClient.tsx components/PosClientPro.tsx components/InventoryClient.tsx components/OperationalSalesInsights.tsx components/AdminPinManager.tsx app/layout.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align YUKI dashboard POS inventory and protected actions"
          git push origin HEAD:fix/yuki-workflow-ux-v15
