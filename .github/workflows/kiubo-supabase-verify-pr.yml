name: KIUBO Supabase Verify PR

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/SUPABASE_VERIFY_TRIGGER.txt

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'verdesotostiven4-commits'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify KIUBO Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Repository secret KIUBO_SUPABASE_DB_URL is missing"
            exit 2
          fi

          echo "Testing connection..."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select 'connection_ok';"

          echo "Expected table count: 13"
          COUNT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select count(*)
            from information_schema.tables
            where table_schema='public'
              and table_name in (
                'platform_admins','tenants','tenant_members','branches','tenant_member_branches',
                'plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings',
                'tenant_branding','sync_entities','sync_receipts'
              );
          ")
          echo "Found table count: $COUNT"

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select table_name
            from information_schema.tables
            where table_schema='public'
              and table_name in (
                'platform_admins','tenants','tenant_members','branches','tenant_member_branches',
                'plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings',
                'tenant_branding','sync_entities','sync_receipts'
              )
            order by table_name;
          "

          echo "Expected critical functions:"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select proname
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and proname in (
                'is_platform_admin','has_tenant_access','has_tenant_role','has_branch_access',
                'tenant_can_operate','tenant_feature_enabled','can_sync_entity','apply_sync_operations',
                'pull_sync_changes','platform_provision_tenant','can_manage_tenant_users',
                'platform_set_tenant_plan','platform_set_tenant_status','can_assign_tenant_role',
                'branch_belongs_to_tenant','normalize_sync_payload'
              )
            order by proname;
          "

          if [ "$COUNT" != "13" ]; then
            echo "KIUBO Supabase schema is incomplete"
            exit 3
          fi

          echo "KIUBO Supabase verification passed"
