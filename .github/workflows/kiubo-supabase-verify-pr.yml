name: KIUBO Supabase Diagnose PR

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/SUPABASE_VERIFY_TRIGGER.txt

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Diagnose connection safely
        id: diagnose
        shell: bash
        run: |
          set +e
          : > diagnostic.txt
          python3 - <<'PY' >> diagnostic.txt
          import os
          from urllib.parse import urlparse
          u=os.environ.get('SUPABASE_DB_URL','')
          if not u:
              print('secret=missing')
              raise SystemExit(0)
          print('secret=present')
          print('placeholder=' + ('yes' if '[YOUR-PASSWORD]' in u else 'no'))
          try:
              p=urlparse(u)
              print('scheme=' + str(p.scheme))
              print('host=' + str(p.hostname))
              print('port=' + str(p.port))
              print('user=' + str(p.username))
              print('database=' + str((p.path or '').lstrip('/')))
              print('password_present=' + ('yes' if p.password else 'no'))
          except Exception as e:
              print('parse_error=' + type(e).__name__ + ':' + str(e))
          PY

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'connection=not_attempted' >> diagnostic.txt
            exit 2
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select 'connection_ok';" >psql.out 2>psql.err
          CODE=$?
          echo "psql_exit=$CODE" >> diagnostic.txt
          if [ $CODE -eq 0 ]; then
            echo 'connection=ok' >> diagnostic.txt
            cat psql.out >> diagnostic.txt
          else
            echo 'connection=failed' >> diagnostic.txt
            python3 - <<'PY' >> diagnostic.txt
          import os
          err=open('psql.err','r',encoding='utf-8',errors='replace').read()
          from urllib.parse import urlparse
          u=os.environ.get('SUPABASE_DB_URL','')
          try:
              pw=urlparse(u).password
              if pw:
                  err=err.replace(pw,'<redacted>')
          except Exception:
              pass
          print(err[:4000])
          PY
          fi
          exit $CODE

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiubo-supabase-diagnostic
          path: diagnostic.txt
          if-no-files-found: error
          retention-days: 1

  schema_state:
    needs: connection
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.tables.outputs.count }}
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Count KIUBO tables
        id: tables
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts');")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "KIUBO tables found: $COUNT/13"
          if [ "$COUNT" != "0" ] && [ "$COUNT" != "13" ]; then exit 3; fi

  bootstrap:
    needs: [connection, schema_state]
    if: needs.schema_state.outputs.count == '0'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply KIUBO migrations 0001-0005
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/migrations/0001_core_multitenant.sql supabase/migrations/0002_sync_substrate.sql supabase/migrations/0003_platform_provisioning.sql supabase/migrations/0004_security_guardrails.sql supabase/migrations/0005_sync_payload_guardrails.sql; do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1 -f "$f"
          done

  verify:
    needs: [connection, schema_state, bootstrap]
    if: always() && needs.connection.result == 'success' && needs.schema_state.result == 'success' && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Verify final schema
        shell: bash
        run: |
          set -euo pipefail
          TABLES=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts');")
          FUNCTIONS=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(distinct proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and proname in ('is_platform_admin','has_tenant_access','has_tenant_role','has_branch_access','tenant_can_operate','tenant_feature_enabled','can_sync_entity','apply_sync_operations','pull_sync_changes','platform_provision_tenant','can_manage_tenant_users','platform_set_tenant_plan','platform_set_tenant_status','can_assign_tenant_role','branch_belongs_to_tenant','normalize_sync_payload');")
          RLS=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('platform_admins','tenants','tenant_members','branches','tenant_member_branches','plans','plan_features','subscriptions','tenant_feature_overrides','tenant_settings','tenant_branding','sync_entities','sync_receipts') and c.relrowsecurity;")
          echo "tables=$TABLES/13 functions=$FUNCTIONS/16 rls=$RLS/13"
          test "$TABLES" = "13"
          test "$FUNCTIONS" = "16"
          test "$RLS" = "13"
