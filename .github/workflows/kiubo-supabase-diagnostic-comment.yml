name: KIUBO Supabase Diagnostic Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/SUPABASE_DIAG_TRIGGER.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Run safe diagnostic/bootstrap
        shell: bash
        run: |
          python3 scripts/supabase-bootstrap.py || true
          test -f docs/SUPABASE_RUN_RESULT.txt

      - name: Upload safe diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiubo-supabase-result
          path: docs/SUPABASE_RUN_RESULT.txt
          if-no-files-found: error
          retention-days: 1
