name: Apply YUKI Client Ops Suite V1

on:
  push:
    branches: [feat/yuki-client-ops-suite-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/yuki-client-ops-suite-v1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair patch matcher
        run: python3 scripts/fix-yuki-client-ops-patcher.py

      - name: Apply patch
        run: python3 scripts/apply-yuki-client-ops-suite-v1.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run KIUBO regression checks
        run: npm run verify

      - name: Production build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "kiubo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/local-store.ts components/PosClientPro.tsx components/ReceiptClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement YUKI client operations suite"
          git push origin HEAD:feat/yuki-client-ops-suite-v1
