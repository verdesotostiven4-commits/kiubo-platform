name: Temporary patch YUKI pending order visuals

on:
  push:
    branches:
      - feat/yuki-pending-order-visuals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yuki-pending-order-visuals
          fetch-depth: 0
      - name: Apply pending-order visual states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pos=Path('components/PosClientPro.tsx')
          t=pos.read_text()

          old='const openTableOrders=db.orders.filter(order=>isOpenOrder(order,ctx)&&order.serviceMode==="table").sort((a,b)=>Date.parse(b.updatedAt||b.createdAt)-Date.parse(a.updatedAt||a.createdAt)),openDeliveryOrders=db.orders.filter(order=>isOpenOrder(order,ctx)&&order.serviceMode==="delivery").sort((a,b)=>Date.parse(b.updatedAt||b.createdAt)-Date.parse(a.updatedAt||a.createdAt)),deliveryMax=Math.max(3,...openDeliveryOrders.map(order=>Number(order.tableLabel)||0)),deliveryLabels=Array.from({length:deliveryMax},(_,index)=>String(index+1)),tableNumbers=tableLabelsFromSettings(settings);'
          new='const openTableOrders=db.orders.filter(order=>isOpenOrder(order,ctx)&&order.serviceMode==="table").sort((a,b)=>Date.parse(b.updatedAt||b.createdAt)-Date.parse(a.updatedAt||a.createdAt)),openDeliveryOrders=db.orders.filter(order=>isOpenOrder(order,ctx)&&order.serviceMode==="delivery").sort((a,b)=>Date.parse(b.updatedAt||b.createdAt)-Date.parse(a.updatedAt||a.createdAt)),openTakeawayOrders=db.orders.filter(order=>isOpenOrder(order,ctx)&&order.serviceMode==="takeaway").sort((a,b)=>Date.parse(b.updatedAt||b.createdAt)-Date.parse(a.updatedAt||a.createdAt)),deliveryMax=Math.max(3,...openDeliveryOrders.map(order=>Number(order.tableLabel)||0)),deliveryLabels=Array.from({length:deliveryMax},(_,index)=>String(index+1)),tableNumbers=tableLabelsFromSettings(settings),tablePendingLabels=new Set(openTableOrders.map(order=>order.tableLabel).filter(Boolean)),deliveryPendingLabels=new Set(openDeliveryOrders.map(order=>order.tableLabel).filter(Boolean));if(activeServiceMode==="table"&&tableLabel&&cartCount>0)tablePendingLabels.add(tableLabel);if(activeServiceMode==="delivery"&&tableLabel&&cartCount>0)deliveryPendingLabels.add(tableLabel);const pendingCountForMode=(mode:ServiceMode)=>mode==="table"?tablePendingLabels.size:mode==="delivery"?deliveryPendingLabels.size:mode==="takeaway"?openTakeawayOrders.length+(activeServiceMode==="takeaway"&&cartCount>0&&!activeOrderId?1:0):0;'
          if old not in t: raise SystemExit('open order summary target not found')
          t=t.replace(old,new,1)

          old='<div className="service-mode-bar">{enabledModes.map(mode=><button key={mode} className={activeServiceMode===mode?"selected":""} onClick={()=>changeServiceMode(mode)}>{serviceLabel[mode]}</button>)}</div>'
          new='<div className="service-mode-bar">{enabledModes.map(mode=>{const pendingCount=pendingCountForMode(mode);return <button key={mode} className={`${activeServiceMode===mode?"selected":""} ${pendingCount>0?"has-pending":""}`} aria-label={`${serviceLabel[mode]}${pendingCount>0?` · ${pendingCount} pedido${pendingCount===1?"":"s"} abierto${pendingCount===1?"":"s"}`:""}`} onClick={()=>changeServiceMode(mode)}><span>{serviceLabel[mode]}</span>{pendingCount>0&&<i className="service-pending-count" aria-hidden="true">{pendingCount}</i>}</button>})}</div>'
          if old not in t: raise SystemExit('service mode bar target not found')
          t=t.replace(old,new,1)

          old='return <button key={label} className={`${occupied?"occupied":"free"} ${active?"active":""}`} onClick={()=>selectTable(label)}><strong>Mesa {label}</strong><span>{active?(cartCount?`${shownCount} prod. · ${money(shownTotal)}`:"Pedido vacío"):open?`${shownCount} prod. · ${money(shownTotal)}`:"Libre"}</span></button>'
          new='return <button key={label} className={`${occupied?"occupied pending-order":"free"} ${active?"active":""}`} aria-label={`Mesa ${label}${occupied?" · pedido abierto":" · libre"}`} onClick={()=>selectTable(label)}>{occupied&&<i className="order-pending-dot" aria-hidden="true"/>}<strong>Mesa {label}</strong><span>{active?(cartCount?`${shownCount} prod. · ${money(shownTotal)}`:"Pedido vacío"):open?`${shownCount} prod. · ${money(shownTotal)}`:"Libre"}</span></button>'
          if old not in t: raise SystemExit('table button target not found')
          t=t.replace(old,new,1)

          old='return <button type="button" key={label} className={active?"active":""} onClick={()=>selectDelivery(label)}><strong>Domicilio {label}</strong><span>{active?(cartCount?`${cartCount} prod. · ${money(total)}`:"Pedido vacío"):open?`${open.items.reduce((sum,item)=>sum+item.qty,0)} prod. · ${money(open.total)}`:"Libre"}</span></button>'
          new='const occupied=active?cartCount>0:Boolean(open);return <button type="button" key={label} className={`${occupied?"pending-order":""} ${active?"active":""}`} aria-label={`Domicilio ${label}${occupied?" · pedido abierto":" · libre"}`} onClick={()=>selectDelivery(label)}>{occupied&&<i className="order-pending-dot" aria-hidden="true"/>}<strong>Domicilio {label}</strong><span>{active?(cartCount?`${cartCount} prod. · ${money(total)}`:"Pedido vacío"):open?`${open.items.reduce((sum,item)=>sum+item.qty,0)} prod. · ${money(open.total)}`:"Libre"}</span></button>'
          if old not in t: raise SystemExit('delivery button target not found')
          t=t.replace(old,new,1)
          pos.write_text(t)

          css=Path('app/globals.css')
          s=css.read_text()
          marker='/* KIUBO pending-order visual attention */'
          if marker not in s:
              s += '''\n\n/* KIUBO pending-order visual attention */\n.service-mode-bar button{position:relative}.service-mode-bar button.has-pending:not(.selected){border-color:#e6b15e;background:#fff9ef;color:#77501e}.service-mode-bar button.has-pending.selected{box-shadow:inset 0 -3px #e8a33c}.service-mode-bar button .service-pending-count{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:999px;background:#e69a2f;color:#fff;font-size:10px;font-weight:900;font-style:normal;line-height:1;box-shadow:0 0 0 3px rgba(230,154,47,.13)}.table-selector-grid button,.delivery-selector-grid button{position:relative}.table-selector-grid button.pending-order:not(.active),.delivery-selector-grid button.pending-order:not(.active){border-color:#e6b15e;background:#fffaf1;box-shadow:0 7px 18px rgba(138,91,23,.08)}.table-selector-grid button.pending-order:not(.active) strong,.delivery-selector-grid button.pending-order:not(.active) strong{color:#6f4a1d}.order-pending-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:999px;background:#e69a2f;box-shadow:0 0 0 3px #fff0d8}.table-selector-grid button.active .order-pending-dot,.delivery-selector-grid button.active .order-pending-dot{box-shadow:0 0 0 3px rgba(255,255,255,.72)}@media(max-width:640px){.service-mode-bar button .service-pending-count{min-width:17px;height:17px;font-size:9px;margin-left:5px}.order-pending-dot{top:7px;right:7px}}\n'''
          css.write_text(s)
          PY
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "kiubo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/PosClientPro.tsx app/globals.css
          git commit -m "feat: surface pending restaurant orders visually"
          git push origin HEAD:feat/yuki-pending-order-visuals
