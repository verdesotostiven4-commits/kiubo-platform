name: Temporary inspect POS pending UI

on:
  push:
    branches:
      - feat/yuki-pending-order-visuals

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yuki-pending-order-visuals
          fetch-depth: 0
      - name: Extract focused POS snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/PosClientPro.tsx')
          t=p.read_text()
          out=[]
          for n in ['const changeServiceMode','const selectTable','const selectDelivery','service-mode-bar','table-selector-grid','delivery-selector-grid']:
              i=t.find(n)
              out.append(f'\n===== {n} =====\n')
              if i<0:
                  out.append('NOT FOUND\n')
              else:
                  out.append(t[max(0,i-1200):min(len(t),i+4200)])
                  out.append('\n')
          css_hits=[]
          for path in Path('.').rglob('*.css'):
              try: s=path.read_text()
              except: continue
              if 'service-mode-bar' in s or 'table-selector-grid' in s or 'delivery-selector-grid' in s:
                  css_hits.append(str(path))
                  for n in ['service-mode-bar','table-selector-grid','delivery-selector-grid']:
                      i=s.find(n)
                      if i>=0:
                          out.append(f'\n===== CSS {path} :: {n} =====\n')
                          out.append(s[max(0,i-1200):min(len(s),i+3500)])
          out.append('\n===== CSS FILES =====\n'+'\n'.join(css_hits))
          Path('tmp-pos-pending-snippets.txt').write_text(''.join(out))
          PY
      - name: Commit inspection artifact
        shell: bash
        run: |
          git config user.name "verdesotiven4-commits"
          git config user.email "verdesotostiven4@gmail.com"
          git add tmp-pos-pending-snippets.txt
          git commit -m "chore: inspect POS pending interactions and styles" || exit 0
          git push origin HEAD:feat/yuki-pending-order-visuals
