name: Apply protected POS table guard syntax

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pos-table-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact table isolation guards
        shell: python
        run: |
          from pathlib import Path
          path = Path('components/PosClientPro.tsx')
          text = path.read_text()
          replacements = {
            'draftMode=="table"?(order.serviceMode=="table"&&order.tableLabel===draftTable):order.serviceMode===draftMode': 'draftMode==="table"?(order.serviceMode==="table"&&order.tableLabel===draftTable):order.serviceMode===draftMode',
            'activeMatches=activeExisting&&(activeServiceMode=="table"?activeExisting.serviceMode=="table"&&activeExisting.tableLabel===tableLabel.trim():activeExisting.serviceMode===activeServiceMode)': 'activeMatches=activeExisting&&(activeServiceMode==="table"?activeExisting.serviceMode==="table"&&activeExisting.tableLabel===tableLabel.trim():activeExisting.serviceMode===activeServiceMode)',
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'Expected one target for {old!r}, found {text.count(old)}')
            text = text.replace(old, new)
          path.write_text(text)
      - run: npm install --ignore-scripts
      - run: npm run verify:tables
      - name: Commit tested guard and remove temporary workflow
        run: |
          git config user.name "kiubo-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-pos-table-guard.yml
          git add components/PosClientPro.tsx
          git commit -m "test: preserve POS table isolation guards"
          git push
