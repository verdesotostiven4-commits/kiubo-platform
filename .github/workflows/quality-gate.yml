name: KIUBO Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiubo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check catalog Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/catalog-api/index.ts
          deno check --node-modules-dir=auto supabase/functions/catalog-router/index.ts
          deno check --node-modules-dir=auto supabase/functions/catalog-notify/index.ts

      - name: Run KIUBO regression checks
        run: npm run verify

      - name: Production build
        run: npm run build
