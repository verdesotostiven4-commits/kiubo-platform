name: KIUBO Quality Gate (manual)

on:
  workflow_dispatch:

jobs:
  quality:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run KIUBO regression checks
        run: npm run verify

      - name: Production build
        run: npm run build
