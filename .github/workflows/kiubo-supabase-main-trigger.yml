name: KIUBO Supabase Main Trigger

on:
  push:
    branches:
      - main
    paths:
      - docs/SUPABASE_MAIN_TRIGGER.txt

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.KIUBO_SUPABASE_DB_URL }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Run trusted KIUBO bootstrap
        shell: bash
        run: |
          python3 scripts/supabase-bootstrap.py || true
          if [ ! -f docs/SUPABASE_RUN_RESULT.txt ]; then
            printf 'KIUBO Supabase bootstrap result\nstatus=FAILED_RUNNER_NO_RESULT\n' > docs/SUPABASE_RUN_RESULT.txt
          fi

      - name: Persist safe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SUPABASE_RUN_RESULT.txt
          git commit -m "chore: record Supabase bootstrap result [skip ci]" || true
          git push origin HEAD:main
